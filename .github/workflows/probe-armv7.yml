name: probe-armv7
# Step 1 only: does the UNMODIFIED engine compile for Android armeabi-v7a with the NDK?
# No SDL Java glue / APK yet. We compile with SDL2 headers only (-c, no link) to surface source-level problems.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "snibbetracker/**"
      - ".github/workflows/probe-armv7.yml"

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get SDL2 headers
        run: |
          git clone --depth 1 --branch release-2.30.x https://github.com/libsdl-org/SDL.git /tmp/SDL
          ls /tmp/SDL/include | head -3

      - name: Show NDK
        run: |
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_NDK_LATEST_HOME" | head -5

      - name: Compile each source for armv7 (compile only)
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
          "$CC" --version | head -1
          SRC=snibbetracker/src
          FAIL=0
          for f in CAllocator CEngine CInput CSynth main dir_posix cJSON/cJSON; do
            LOG="/tmp/$(basename $f).log"
            if "$CC" -c -std=gnu99 -Wall -Wno-unused-function \
                 -I"$SRC" -I"$SRC/cJSON" -I/tmp/SDL/include \
                 "$SRC/$f.c" -o "/tmp/$(basename $f).o" >"$LOG" 2>&1; then
              echo "OK   $f.c ($(grep -c 'warning:' "$LOG") warnings)"
            else
              echo "FAIL $f.c"; FAIL=1
              # surface each compiler error as a GitHub annotation so it is readable via the API
              grep -E "error:" "$LOG" | head -15 | while IFS= read -r line; do
                echo "::error title=compile $f.c::${line//%/%25}"
              done
            fi
          done
          # also publish an overall summary line as a notice
          echo "::notice title=probe result::failures=$FAIL"
          exit $FAIL

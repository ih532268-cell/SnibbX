name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "snibbetracker/**"
      - "android/**"
      - "res/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write   # required to create a GitHub Release

env:
  SDL_TAG: release-2.30.12   # exact version whose sources/Java glue we read locally

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch SDL (pinned tag)
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git /tmp/SDL
          echo "SDL at $(git -C /tmp/SDL rev-parse --short HEAD)"

      - name: Assemble Android project
        run: |
          set -eu
          P=/tmp/proj
          rm -rf "$P"
          cp -r /tmp/SDL/android-project "$P"

          # SDL itself: linked as jni/SDL (this is what SDL's own template expects)
          ln -s /tmp/SDL "$P/app/jni/SDL"

          # our NDK module replaces the template's placeholder module
          rm -rf "$P/app/jni/src"
          mkdir -p "$P/app/jni/src/engine"
          cp android/jni/src/Android.mk android/jni/src/android_log.c android/jni/src/android_log.h \
             android/jni/src/touch_kb.c android/jni/src/touch_kb.h "$P/app/jni/src/"
          cp -r snibbetracker/src/* "$P/app/jni/src/engine/"
          # <SDL2/SDL.h> support (see Android.mk): sdl2_prefix/SDL2 -> SDL's include dir
          mkdir -p "$P/app/jni/src/sdl2_prefix"
          ln -s /tmp/SDL/include "$P/app/jni/src/sdl2_prefix/SDL2"
          # engine dir contains files we must not compile on Android
          rm -f "$P/app/jni/src/engine/dir_win.c" "$P/app/jni/src/engine/dir_win.h" \
                "$P/app/jni/src/engine/osx_settings.m" "$P/app/jni/src/engine/osx_settings.h"
          cp android/jni/Application.mk "$P/app/jni/Application.mk"

          # Java: SDL's own classes (from the pinned tag) + our two
          cp android/java/org/libsdl/app/*.java "$P/app/src/main/java/org/libsdl/app/"

          # manifest + resources
          cp android/AndroidManifest.xml "$P/app/src/main/AndroidManifest.xml"
          cp android/res/values/strings.xml "$P/app/src/main/res/values/strings.xml"

          # demo songs + default config go into the APK assets
          mkdir -p "$P/app/src/main/assets/demos"
          cp res/demos/*.snibb "$P/app/src/main/assets/demos/"

          echo "tree:"; (cd "$P/app" && find jni/src src/main -maxdepth 4 -type f | sort | head -60)

      - name: Configure Gradle for one APK per ABI (verified edit)
        run: |
          set -eu
          G=/tmp/proj/app/build.gradle
          grep -q "^android {" "$G" || { echo "::error title=gradle edit::no 'android {' line found"; exit 1; }

          cat > /tmp/inject.gradle <<'BLOCK'
          android {
              // one APK per ABI instead of a single universal APK containing all four .so files
              splits {
                  abi {
                      enable true
                      reset()
                      include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                      universalApk false
                  }
              }
          BLOCK

          before=$(grep -c "^android {" "$G")
          [ "$before" = "1" ] || { echo "::error title=gradle edit::expected exactly one 'android {' line, found $before"; exit 1; }
          awk '/^android \{$/ && !done { while ((getline line < "/tmp/inject.gradle") > 0) print line; done=1; next } { print }' "$G" > /tmp/build.gradle.new
          mv /tmp/build.gradle.new "$G"
          grep -n "splits\|enable true\|universalApk" "$G"

          cat >> "$G" <<'TAIL'

          ext.abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]
          android.applicationVariants.all { variant ->
              variant.outputs.each { output ->
                  def abi = output.getFilter(com.android.build.OutputFile.ABI)
                  if (abi != null && project.ext.abiCodes.containsKey(abi)) {
                      output.versionCodeOverride = variant.versionCode * 10 + project.ext.abiCodes[abi]
                  }
              }
          }
          TAIL

          grep -n "namespace" "$G"


      - name: Pre-flight (fail fast, readable)
        run: |
          set -u
          fail=0
          check() { if [ -e "$1" ]; then echo "ok   $1"; else echo "MISSING $1"; echo "::error title=preflight::missing $1"; fail=1; fi; }
          P=/tmp/proj/app
          check $P/jni/SDL/include/SDL.h
          check $P/jni/SDL/Android.mk
          check $P/jni/src/Android.mk
          check $P/jni/src/sdl2_prefix/SDL2/SDL.h
          check $P/jni/src/engine/main.c
          check $P/jni/src/engine/cJSON/cJSON.c
          check $P/jni/src/android_log.c
          check $P/jni/src/touch_kb.c
          check $P/jni/src/touch_kb.h
          check $P/src/main/java/org/libsdl/app/SDLActivity.java
          check $P/src/main/java/org/libsdl/app/SnibbeActivity.java
          check $P/src/main/assets/demos/catslayer.snibb
          check $P/src/main/AndroidManifest.xml
          exit $fail

      - name: Build debug APK
        id: gradle
        working-directory: /tmp/proj
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug > /tmp/gradle.log 2>&1
          rc=$?
          echo "gradle exit code: $rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # The raw job log is not reachable from the developer's sandbox, only annotations are.
          # So surface the interesting lines as annotations (GitHub caps these, keep it tight).
          grep -nE "error:|FAILED|What went wrong|Execution failed|undefined reference|fatal error|cannot find|not found|AAPT|Unresolved" /tmp/gradle.log \
            | head -25 | while IFS= read -r line; do
                msg=${line//%/%25}; msg=${msg//$'\r'/}; 
                echo "::error title=gradle::${msg:0:900}"
              done
          echo "----- last 40 lines of gradle log -----"
          tail -40 /tmp/gradle.log
          exit $rc

      - name: Locate APKs (one per ABI)
        if: success()
        run: |
          set -eu
          find /tmp/proj/app/build/outputs -name "*.apk" -exec ls -la {} \;
          mkdir -p out
          shopt -s nullglob
          any=0
          for f in /tmp/proj/app/build/outputs/apk/debug/*.apk; do
            base=$(basename "$f")
            # gradle names split outputs like "app-armeabi-v7a-debug.apk"; keep the ABI, drop the rest
            abi=$(echo "$base" | grep -oE 'armeabi-v7a|arm64-v8a|x86_64|x86' || true)
            if [ -z "$abi" ]; then
              echo "::warning title=apk::skipping unrecognised output $base"
              continue
            fi
            cp "$f" "out/SnibbX-${abi}-debug.apk"
            any=1
          done
          [ "$any" = "1" ] || { echo "::error title=apk::no per-ABI APK was produced at all"; exit 1; }
          ls -la out/
          for f in out/*.apk; do echo "::notice title=apk::built $(basename "$f") ($(du -h "$f" | cut -f1))"; done

      - name: Verify APK contents (ABI + our classes)
        if: success()
        run: |
          set -u
          cd out
          fail=0
          for f in *.apk; do
            abi=$(echo "$f" | sed -E 's/^SnibbX-(.*)-debug\.apk$/\1/')
            echo "--- $f (abi=$abi) ---"
            unzip -l "$f" | grep -E "lib/|assets/demos|classes" | head -10
            if ! unzip -l "$f" | grep -q "lib/${abi}/libmain.so"; then
              echo "::error title=apk::libmain.so missing for $abi in $f"; fail=1
            fi
            if ! unzip -l "$f" | grep -q "lib/${abi}/libSDL2.so"; then
              echo "::error title=apk::libSDL2.so missing for $abi in $f"; fail=1
            fi
            # a per-ABI split must contain ONLY that ABI's native libs, never another one's
            other=$(unzip -l "$f" | grep -E "^\s*[0-9]+.*lib/" | grep -v "lib/${abi}/" || true)
            if [ -n "$other" ]; then
              echo "::error title=apk::$f contains native libs from a DIFFERENT abi:"
              echo "$other"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "::notice title=apk verify::all 4 ABI splits contain exactly their own libmain.so + libSDL2.so"

      - name: Publish APK as GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          SHA=$(git rev-parse --short HEAD)
          TAG="apk-${GITHUB_RUN_NUMBER}-${SHA}"
          gh release create "$TAG" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "SnibbX debug build #${GITHUB_RUN_NUMBER} (${SHA})" \
            --notes "Debug APKs (unsigned/debug-signed), one per ABI - pick the one matching your device: armeabi-v7a (most phones, 32-bit), arm64-v8a (most phones, 64-bit), x86 / x86_64 (emulators, some Chromebooks). Unofficial Android port of snibbetracker; touch keyboard, song export/import via FILE, and an in-app LOG viewer are all included. Open LOG (top-right) to copy the log if something fails." \
            --prerelease
          echo "::notice title=release::published $TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | "asset: \(.name) \(.size) bytes")'
